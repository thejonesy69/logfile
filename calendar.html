<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Standby Duty Calendar</title>
<style>
  :root {
    --bg: #1d2330;
    --panel: #252c3c;
    --panel-2: #2f3647;
    --border: #3a4258;
    --text: #e6e8ee;
    --muted: #9aa3b8;
    --accent: #4a90e2;
    --accent-hover: #5aa1f2;
    --regular: #4a90e2;
    --ot: #e2a24a;
    --holiday: #e24a6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 24px;
  }
  main { max-width: 980px; margin: 0 auto; }
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 16px;
  }
  h1 { font-size: 20px; margin: 0; }
  a.back {
    color: var(--muted);
    text-decoration: none;
    font-size: 13px;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 12px;
  }
  a.back:hover { color: var(--text); border-color: var(--accent); }

  .toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 16px;
    font-size: 13px;
    color: var(--muted);
  }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .dot.regular { background: var(--regular); }
  .dot.ot { background: var(--ot); }
  .dot.holiday { background: var(--holiday); }

  .swap-bar {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .swap-bar button {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 7px 14px;
    font-size: 13px;
    cursor: pointer;
  }
  .swap-bar button:hover { background: var(--accent-hover); }
  .swap-bar button:disabled { background: #4a5164; cursor: not-allowed; }
  .swap-bar button.cancel { background: transparent; border: 1px solid var(--border); color: var(--muted); }
  .swap-bar button.cancel:hover { color: var(--text); border-color: var(--accent); }

  table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  th {
    background: var(--panel-2);
    color: var(--muted);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.4px;
    padding: 8px 4px;
    text-align: center;
    border: 1px solid var(--border);
  }
  td {
    border: 1px solid var(--border);
    vertical-align: top;
    height: 78px;
    padding: 5px 6px;
    font-size: 11px;
    background: var(--panel);
  }
  td.empty { background: transparent; border-color: transparent; }
  td.selectable { cursor: pointer; }
  td.selectable:hover { background: var(--panel-2); }
  td.selected { outline: 2px solid var(--accent); outline-offset: -2px; background: var(--panel-2); }
  .daynum { color: var(--muted); font-weight: 600; margin-bottom: 3px; }
  .entry-type { font-weight: 600; }
  .entry-type.regular { color: var(--regular); }
  .entry-type.ot { color: var(--ot); }
  .entry-type.holiday { color: var(--holiday); }
  .entry-person { color: var(--text); margin-top: 2px; }
  .entry-hours { color: var(--muted); }
  .entry-ports { color: var(--muted); font-size: 10px; }

  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }
  .toast.show { opacity: 1; }

  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.5);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  .modal-backdrop.show { display: flex; }
  .modal {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    width: 280px;
  }
  .modal h2 { font-size: 15px; margin: 0 0 4px; }
  .modal p { font-size: 12px; color: var(--muted); margin: 0 0 12px; }
  .modal input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 14px;
    margin-bottom: 12px;
  }
  .modal .row { display: flex; gap: 8px; justify-content: flex-end; }
  .modal button {
    border: none;
    border-radius: 6px;
    padding: 7px 14px;
    font-size: 13px;
    cursor: pointer;
  }
  .modal button.confirm { background: var(--accent); color: #fff; }
  .modal button.cancel { background: transparent; border: 1px solid var(--border); color: var(--muted); }
</style>
</head>
<body>
<main>
  <header>
    <h1>Tampa Port &mdash; Standby Duty Calendar</h1>
    <a class="back" href="/">&larr; Home</a>
  </header>

  <div class="toolbar">
    <span id="month-label">Loading&hellip;</span>
    <div class="legend">
      <span><i class="dot regular"></i>Regular</span>
      <span><i class="dot ot"></i>OT</span>
      <span><i class="dot holiday"></i>Holiday OT</span>
    </div>
    <div class="swap-bar">
      <span id="swap-hint" style="display:none">Pick a second day to swap with</span>
      <button id="swap-toggle">Swap two days</button>
      <button id="swap-cancel" class="cancel" style="display:none">Cancel</button>
    </div>
  </div>

  <table id="grid">
    <thead>
      <tr>
        <th>Sun</th><th>Mon</th><th>Tue</th><th>Wed</th><th>Thu</th><th>Fri</th><th>Sat</th>
      </tr>
    </thead>
    <tbody id="grid-body"></tbody>
  </table>
</main>

<div class="toast" id="toast"></div>

<div class="modal-backdrop" id="pin-modal">
  <div class="modal">
    <h2>Confirm swap</h2>
    <p id="pin-modal-desc"></p>
    <input type="password" id="pin-input" placeholder="PIN">
    <div class="row">
      <button class="cancel" id="pin-cancel">Cancel</button>
      <button class="confirm" id="pin-confirm">Swap</button>
    </div>
  </div>
</div>

<script>
const MONTH = '2026-09';
const DAYS_IN_MONTH = 30;
const FIRST_WEEKDAY = 2; // Sept 1, 2026 is a Tuesday (0=Sun)
const MONTH_LABEL = 'September 2026';

let entries = {};
let selecting = false;
let selectedDate = null;
let pendingSwap = null;

const $ = id => document.getElementById(id);

function typeClass(type) {
  if (type === 'Holiday OT') return 'holiday';
  if (type === 'OT') return 'ot';
  return 'regular';
}

function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2600);
}

async function loadMonth() {
  $('month-label').textContent = MONTH_LABEL;
  try {
    const res = await fetch(`/api/duty/${MONTH}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    entries = {};
    for (const e of data.entries) entries[e.date] = e;
  } catch (err) {
    toast('Could not load calendar data: ' + err.message);
  }
  render();
}

function render() {
  const body = $('grid-body');
  body.innerHTML = '';
  let row = document.createElement('tr');
  for (let i = 0; i < FIRST_WEEKDAY; i++) row.appendChild(emptyCell());

  for (let day = 1; day <= DAYS_IN_MONTH; day++) {
    const date = `${MONTH}-${String(day).padStart(2, '0')}`;
    const col = (FIRST_WEEKDAY + day - 1) % 7;
    if (col === 0 && day !== 1) { body.appendChild(row); row = document.createElement('tr'); }
    row.appendChild(dayCell(day, date));
  }
  body.appendChild(row);
}

function emptyCell() {
  const td = document.createElement('td');
  td.className = 'empty';
  return td;
}

function dayCell(day, date) {
  const td = document.createElement('td');
  const e = entries[date];
  let html = `<div class="daynum">${day}</div>`;
  if (e) {
    html += `<div class="entry-type ${typeClass(e.type)}">${e.type}</div>`;
    html += `<div class="entry-person">${e.person}</div>`;
    html += `<div class="entry-hours">${e.hours}h</div>`;
    html += `<div class="entry-ports">${e.ports}</div>`;
  }
  td.innerHTML = html;

  if (e) {
    td.classList.add('selectable');
    td.addEventListener('click', () => onDayClick(date, td));
  }
  return td;
}

function onDayClick(date, td) {
  if (!selecting) return;
  if (!selectedDate) {
    selectedDate = date;
    td.classList.add('selected');
    $('swap-hint').style.display = '';
    return;
  }
  if (date === selectedDate) return;
  openPinModal(selectedDate, date);
}

function openPinModal(date1, date2) {
  pendingSwap = { date1, date2 };
  $('pin-modal-desc').textContent =
    `Swap ${entries[date1].person} (${formatShort(date1)}) with ${entries[date2].person} (${formatShort(date2)})?`;
  $('pin-input').value = '';
  $('pin-modal').classList.add('show');
  $('pin-input').focus();
}

function formatShort(date) {
  const [, m, d] = date.split('-').map(Number);
  return `${m}/${d}`;
}

function resetSelection() {
  selecting = false;
  selectedDate = null;
  $('swap-hint').style.display = 'none';
  $('swap-toggle').style.display = '';
  $('swap-cancel').style.display = 'none';
  render();
}

$('swap-toggle').addEventListener('click', () => {
  selecting = true;
  $('swap-toggle').style.display = 'none';
  $('swap-cancel').style.display = '';
});
$('swap-cancel').addEventListener('click', resetSelection);

$('pin-cancel').addEventListener('click', () => {
  $('pin-modal').classList.remove('show');
  pendingSwap = null;
});

$('pin-confirm').addEventListener('click', async () => {
  if (!pendingSwap) return;
  const pin = $('pin-input').value.trim();
  if (!pin) { toast('Enter the PIN'); return; }
  try {
    const res = await fetch(`/api/duty/${MONTH}/swap`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ...pendingSwap, pin }),
    });
    const data = await res.json();
    if (!res.ok) { toast(data.error || 'Swap failed'); return; }
    entries = {};
    for (const e of data.entries) entries[e.date] = e;
    $('pin-modal').classList.remove('show');
    pendingSwap = null;
    toast('Swapped.');
    resetSelection();
  } catch (err) {
    toast('Network error: ' + err.message);
  }
});

$('pin-input').addEventListener('keydown', e => { if (e.key === 'Enter') $('pin-confirm').click(); });

loadMonth();
</script>
</body>
</html>
