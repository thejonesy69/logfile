<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pirateme.lol</title>
<style>
  :root {
    --bg: #1d2330;
    --panel: #252c3c;
    --panel-2: #2f3647;
    --border: #3a4258;
    --text: #e6e8ee;
    --muted: #9aa3b8;
    --accent: #4a90e2;
    --accent-hover: #5aa1f2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 24px;
  }
  main {
    width: 100%;
    max-width: 720px;
  }
  h1 {
    font-size: 22px;
    font-weight: 600;
    text-align: center;
    margin: 0 0 8px;
    color: var(--text);
  }
  .sub {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    margin: 0 0 32px;
  }
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 16px;
  }
  a.card {
    display: block;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 24px;
    text-decoration: none;
    color: var(--text);
    transition: border-color 0.15s, background 0.15s, transform 0.15s;
  }
  a.card:hover {
    border-color: var(--accent);
    background: var(--panel-2);
    transform: translateY(-2px);
  }
  .card-icon {
    font-size: 28px;
    margin-bottom: 12px;
  }
  .card-title {
    font-size: 17px;
    font-weight: 600;
    margin-bottom: 6px;
  }
  .card-desc {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.4;
  }
  .card.soon {
    opacity: 0.6;
    cursor: default;
  }
  .card.soon:hover {
    border-color: var(--border);
    background: var(--panel);
    transform: none;
  }
  .badge {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.4px;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 2px 6px;
    margin-left: 8px;
    vertical-align: middle;
  }
</style>
</head>
<body>
<main>
  <h1>pirateme.lol</h1>
  <p class="sub">Pick a tool</p>
  <div class="cards">
    <a class="card" href="/log_viewer.html">
      <div class="card-icon">🛗</div>
      <div class="card-title">Elevator Log Viewer</div>
      <div class="card-desc">Drop compressed or plain-text elevator logs to inspect faults, I/O signals, and timelines.</div>
    </a>
    <a class="card" href="/calendar.html">
      <div class="card-icon">📅</div>
      <div class="card-title">Standby Duty Calendar</div>
      <div class="card-desc">Tampa Port standby rotation — who's on duty, and a way to swap days.</div>
    </a>
  </div>
</main>
</body>
</html>
