<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wiring Diagrams &amp; Manuals</title>
<style>
  :root {
    --bg: #1d2330;
    --panel: #252c3c;
    --border: #3a4258;
    --text: #e6e8ee;
    --muted: #9aa3b8;
    --accent: #4a90e2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 24px;
  }
  main { text-align: center; max-width: 480px; }
  .icon { font-size: 40px; margin-bottom: 12px; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { color: var(--muted); font-size: 14px; line-height: 1.5; margin: 0 0 24px; }
  a.back {
    display: inline-block;
    color: var(--accent);
    text-decoration: none;
    font-size: 14px;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 16px;
  }
  a.back:hover { border-color: var(--accent); }
</style>
</head>
<body>
<main>
  <div class="icon">📐</div>
  <h1>Wiring Diagrams &amp; Manuals</h1>
  <p>Archive is being processed and will be searchable here shortly.</p>
  <a class="back" href="/">&larr; Back to home</a>
</main>
</body>
</html>
