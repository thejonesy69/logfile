<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wiring Diagrams &amp; Manuals</title>
<style>
  :root {
    --bg: #1d2330;
    --panel: #252c3c;
    --panel-2: #2f3647;
    --border: #3a4258;
    --text: #e6e8ee;
    --muted: #9aa3b8;
    --accent: #4a90e2;
    --accent-hover: #5aa1f2;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 14px;
  }
  body { display: flex; flex-direction: column; }
  header {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    flex-shrink: 0;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; white-space: nowrap; }
  a.back {
    color: var(--muted);
    text-decoration: none;
    font-size: 13px;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 12px;
    white-space: nowrap;
  }
  a.back:hover { color: var(--text); border-color: var(--accent); }
  #search {
    flex: 1;
    min-width: 180px;
    background: #1a1f2b;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 14px;
    outline: none;
  }
  #search:focus { border-color: var(--accent); }
  #count { color: var(--muted); font-size: 12px; white-space: nowrap; }

  main { flex: 1; overflow-y: auto; padding: 16px; }

  .vendor-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 10px;
  }
  .vendor-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    cursor: pointer;
    font-size: 13px;
  }
  .vendor-card:hover { border-color: var(--accent); background: var(--panel-2); }
  .vendor-name { font-weight: 600; margin-bottom: 2px; }
  .vendor-count { color: var(--muted); font-size: 11px; }

  table { width: 100%; border-collapse: collapse; }
  th {
    text-align: left;
    color: var(--muted);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.4px;
    padding: 6px 10px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: var(--bg);
  }
  td {
    padding: 7px 10px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    vertical-align: top;
  }
  tr:hover td { background: var(--panel); }
  td.file-name a { color: var(--text); text-decoration: none; }
  td.file-name a:hover { color: var(--accent); text-decoration: underline; }
  td.file-vendor { color: var(--muted); font-size: 12px; white-space: nowrap; }
  td.file-size { color: var(--muted); font-size: 12px; white-space: nowrap; text-align: right; }

  .hint { color: var(--muted); font-size: 13px; padding: 20px; text-align: center; }
  .back-row { margin-bottom: 12px; }
  button.chip {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 5px 10px;
    font-size: 12px;
    cursor: pointer;
  }
  button.chip:hover { border-color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>📐 Wiring Diagrams &amp; Manuals</h1>
  <input id="search" type="text" placeholder="Search by vendor, model, or filename…" autocomplete="off">
  <span id="count"></span>
  <a class="back" href="/">&larr; Home</a>
</header>
<main id="main">
  <div class="hint">Loading archive…</div>
</main>

<script>
const FILES_ROOT = '/prints/';
let manifest = [];      // [path, vendor, size, topCode]
let vendorIndex = new Map();
let currentVendor = null;

const $ = id => document.getElementById(id);
const main = $('main');
const searchEl = $('search');
const countEl = $('count');

function fmtSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(0) + ' KB';
  return (bytes / 1024 / 1024).toFixed(1) + ' MB';
}

function fileUrl(path) {
  return FILES_ROOT + path.split('/').map(encodeURIComponent).join('/');
}

function baseName(path) {
  const i = path.lastIndexOf('/');
  return i === -1 ? path : path.slice(i + 1);
}

async function load() {
  try {
    const res = await fetch('/prints-manifest.json');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    manifest = await res.json();
  } catch (err) {
    main.innerHTML = `<div class="hint">Could not load the archive index: ${err.message}</div>`;
    return;
  }
  for (const e of manifest) {
    const v = e[1] || '(other)';
    if (!vendorIndex.has(v)) vendorIndex.set(v, []);
    vendorIndex.get(v).push(e);
  }
  countEl.textContent = `${manifest.length.toLocaleString()} files, ${vendorIndex.size} vendors/categories`;
  renderVendors();
}

function renderVendors() {
  currentVendor = null;
  const vendors = [...vendorIndex.keys()].sort((a, b) => a.localeCompare(b));
  const html = vendors.map(v => {
    const n = vendorIndex.get(v).length;
    return `<div class="vendor-card" data-vendor="${escapeHtml(v)}">
      <div class="vendor-name">${escapeHtml(v)}</div>
      <div class="vendor-count">${n} file${n === 1 ? '' : 's'}</div>
    </div>`;
  }).join('');
  main.innerHTML = `<div class="vendor-grid">${html}</div>`;
  main.querySelectorAll('.vendor-card').forEach(el => {
    el.addEventListener('click', () => renderFileList(vendorIndex.get(el.dataset.vendor), el.dataset.vendor));
  });
}

function renderFileList(entries, label) {
  currentVendor = label;
  const rows = entries.slice(0, 1000).map(e => {
    const [path, vendor, size] = e;
    return `<tr>
      <td class="file-name"><a href="${fileUrl(path)}" target="_blank" rel="noopener">${escapeHtml(baseName(path))}</a></td>
      <td class="file-vendor">${escapeHtml(vendor)}</td>
      <td class="file-size">${fmtSize(size)}</td>
    </tr>`;
  }).join('');
  const truncNote = entries.length > 1000
    ? `<div class="hint">Showing first 1,000 of ${entries.length.toLocaleString()} — refine your search to narrow it down.</div>` : '';
  main.innerHTML = `
    <div class="back-row"><button class="chip" id="back-to-vendors">&larr; All vendors</button></div>
    <table>
      <thead><tr><th>File</th><th>Vendor / Category</th><th>Size</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    ${truncNote}
  `;
  $('back-to-vendors').addEventListener('click', () => { searchEl.value = ''; renderVendors(); });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

let searchTimer;
searchEl.addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(runSearch, 120);
});

function runSearch() {
  const q = searchEl.value.trim().toLowerCase();
  if (!q) { renderVendors(); return; }
  const terms = q.split(/\s+/);
  const matches = manifest.filter(e => {
    const hay = (e[0] + ' ' + e[1]).toLowerCase();
    return terms.every(t => hay.includes(t));
  });
  countEl.textContent = `${matches.length.toLocaleString()} match${matches.length === 1 ? '' : 'es'}`;
  if (!matches.length) {
    main.innerHTML = `<div class="hint">No files match "${escapeHtml(searchEl.value)}".</div>`;
    return;
  }
  renderFileList(matches, null);
}

load();
</script>
</body>
</html>
